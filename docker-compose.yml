services:
  tegbar:
    build: .
    image: tegbar:latest
    container_name: tegbar
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # Long polling needs no inbound port. Expose only for webhook mode behind a reverse proxy.
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
